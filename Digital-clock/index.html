<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital-clock</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="h-screen bg-linear-65 from-purple-500 to-pink-500 p-20">
    <h1 class="font-extrabold text-5xl text-white text-center mb-10">
      Digital-clock
    </h1>
    <div
      class="container bg-white flex gap-10 justify-center items-center w-full h-120 mt-15 shadow-xl rounded-lg"
    >
      <div
        id="hour"
        class="bg-pink-100 h-60 w-60 flex justify-center items-center rounded-lg shadow-xl font-bold text-8xl text-pink-500"
      >
        00
      </div>
      <span class="font-extrabold text-5xl text-pink-500">:</span>
      <div
        id="min"
        class="bg-pink-100 h-60 w-60 flex justify-center items-center rounded-lg shadow-xl font-bold text-8xl text-pink-500"
      >
        00
      </div>
      <span class="font-extrabold text-5xl text-pink-500">:</span>

      <div
        id="sec"
        class="bg-pink-100 h-60 w-60 flex justify-center items-center rounded-lg shadow-xl font-bold text-8xl text-pink-500"
      >
        00
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
