<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceBook</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <section class="w-full h-screen flex p-10 ">
        <div class="left w-1/2 flex flex-col items-start justify-center  bg-grey-800 relative">
            <h1 class="ml-10 font-bold text-9xl  text-blue-500">facebook</h1>
            <p class="m-10 text-black text-3xl">Connect with friends and the world<br> around you on Facebook.</p>
        </div>
        <div class="right w-1/2  flex flex-col items-center justify-center">
            <div
                class="  w-100 h-90 p-4 flex flex-col rounded shadow-md shadow-blue-500/50 hover:shadow-2xl transition duration-300">
                <input type="text" placeholder="Email or phone number"
                    class="emailid w-full h-10 my-3 border-1 p-2 rounded-lg h-13 outline-none">
                <input type="text" placeholder="Password"
                    class="pwd w-full h-10 my-3 border-1 p-2 rounded-lg h-13 outline-none">
                <button
                    class="log w-full h-10 my-3 border-1 p-2 rounded-lg h-13 text-white bg-blue-500 hover:bg-blue-600 ">Login</button>
                <a href="#" class="text-center my-2 border-b-1 pb-4">forgot password?</a>
                <button
                    class="acc  w-full h-10 my-3 border-1 p-2 rounded-lg h-13 text-white bg-green-500 hover:bg-green-600 ">Create
                    new account</button>

            </div>
        </div>
    </section>



</body>

</html>
