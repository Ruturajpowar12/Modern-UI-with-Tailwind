<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocify - TailwindCss</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container  bg-[url(./images/Image.png)] bg-cover bg-center min-h-screen min-w-full">
        <nav class=" shadow-lg">
            <div class="flex items-center justify-between p-5 font-semibold">
                <img src="./images/logo.png" alt="Grocify Logo" class="h-8 px-2">
                <ul class="flex space-x-15">
                    <li><a href="#" class="text-white hover:text-gray-300">Home</a></li>
                    <li><a href="#" class="text-white hover:text-gray-300">Shop</a></li>
                    <li><a href="#" class="text-white hover:text-gray-300">About</a></li>
                    <li><a href="#" class="text-white hover:text-gray-300">Contact</a></li>
                </ul>
                <img src="./images/cart.png" alt="Cart Icon" class="h-6 px-2">
            </div>
        </nav>
        <div class="maindata  flex items-center justify-between p-4">
            <div class="left">
                <h1 class="text-white text-6xl font-bold m-4 ">Groceries <br> <span
                        class="text-yellow-500 text-5xl">Delivery in 15
                        mins</span>
                </h1>
                <p class="text-white px-4">Grocify offers the fastest grocery delivery service in town! </p>

                <button class="bg-yellow-500 text-black px-4 py-2 rounded hover:bg-yellow-600 m-4 cursor-pointer">Order
                    Now</button>
                <button class=" bg-gray-800 text-white px-4 py-2 rounded hover:bg-gray-600 m-4 cursor-pointer"> Download
                    App</button>
            </div>
            <div class="right w-6/12 h-screen">
                <img src="./images/grocery-image.png" alt="Grocery Image" class="h-screen w-full object-cover">
            </div>
        </div>
    </div>



</body>

</html>
